# Solver branches (drill/*): flag every commit that contains a solution.
#
#   ✅ green   the commit's solution passes
#   ❌ red     it fails, or the commit touches more than one problem
#   ⚙️ pending the message contains WIP: not graded. GitHub can't draw a
#              gear, so it shows its "pending" dot; the status text says
#              "⚙️ ... in progress (WIP)"
#
# Pushes that change nothing under solutions/ (e.g. merging main) don't
# run this workflow, so they get no flag at all. Each commit is graded at
# its own version of the files (`drill ci`); run `drill status --refresh`
# locally to re-grade everything.
name: solutions

on:
  push:
    branches: ["drill/**"]
    paths: ["solutions/**"]

env:
  # Throwaway database that only exists inside this CI job.
  DRILL_DB_PASSWORD: Ci-Only_Drill_Passw0rd
  DRILL_DB_PORT: "1433"

jobs:
  grade:
    name: drill
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ env.DRILL_DB_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost
          -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s --health-timeout 5s --health-retries 20
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: coursier/cache-action@v6
      - uses: VirtusLab/scala-cli-setup@v1
      - run: uv sync
      - name: Flag each solution commit in this push
        env:
          BEFORE: ${{ github.event.before }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]] \
            || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BASE="$(git merge-base origin/main HEAD)"
          else
            BASE="$BEFORE"
          fi
          uv run drill ci "$BASE" HEAD
