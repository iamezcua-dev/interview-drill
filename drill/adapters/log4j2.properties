# Keep Spark quiet while grading: only errors reach the terminal.
# Spark prints a "Setting default log level" banner when its own loggers
# and the root logger disagree, so both are set to ERROR.
rootLogger.level = error
rootLogger.appenderRef.stderr.ref = console
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %p %c{1}: %m%n
logger.apache.name = org.apache
logger.apache.level = error
